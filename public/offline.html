<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QawmiERP — অফলাইন</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #cbd5e1; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #059669;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
    }
    dialog {max-width:min(90vw,400px);max-height:85vh;border:2px solid #f59e0b;border-radius:16px;background:#1e293b;color:#fff;text-align:left;padding:20px;overflow:auto}
    dialog::backdrop {background:#020617b3} dialog button, dialog a {min-height:44px}
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনি এই মুহূর্তে অফলাইনে আছেন। সর্বশেষ তথ্য পেতে ইন্টারনেট চালু করে আবার চেষ্টা করুন।</p>
    <section id="snapshot" hidden style="text-align:left;max-height:55vh;overflow:auto"></section>
    <script src="/offline-portal.js" defer></script>
    <button class="btn" onclick="window.location.reload()">আবার চেষ্টা করুন</button>
    <button class="btn btn-secondary" onclick="window.history.back()">পেছনে যান</button>
  </div>
</body>
</html>
